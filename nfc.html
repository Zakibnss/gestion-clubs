<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>التحقق من الحضور — NFC</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/nfc-reader-service.js?v=20260830"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --ok: #28a745;
            --ko: #dc3545;
            --warn: #ffc107;
            --bg: #101318;
        }
        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background .25s ease;
        }

        header {
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,.04);
        }
        header .brand { display:flex; align-items:center; gap:10px; font-weight:700; }
        header img { height: 34px; border-radius: 50%; }
        #sessionBanner {
            font-size: .85rem;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255,193,7,.15);
            color: var(--warn);
        }
        #sessionBanner.ok { background: rgba(40,167,69,.18); color: #6fdc8c; }

        /* ---------- Zone d'état ---------- */
        #stage {
            flex: 1;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 30px 16px;
            text-align: center;
        }
        #icon {
            font-size: clamp(64px, 22vw, 120px);
            line-height: 1;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%,100% { opacity: .85; transform: scale(1); }
            50%     { opacity: 1;   transform: scale(1.06); }
        }
        #bigTitle { font-size: clamp(20px, 6vw, 30px); font-weight: 800; letter-spacing: 1px; }
        #subText  { font-size: clamp(14px, 4vw, 18px); color: #aab2bd; white-space: pre-line; }

        body.state-ok, body.state-success { background: #0d2b17; }
        body.state-ok #icon, body.state-success #icon { color: var(--ok); animation: none; }
        body.state-expired { background: #38100f; animation: shakeBg .5s; }
        body.state-expired #icon { color: var(--ko); animation: none; }
        body.state-invalid { background: #2a2113; }
        body.state-invalid #icon { color: var(--warn); animation: none; }
        body.state-reading #icon { animation: spinPulse .9s infinite; }

        @keyframes spinPulse { 50% { transform: scale(.92); opacity:.7 } }
        @keyframes shakeBg { 0%,100%{transform:none} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

        /* ---------- Contrôles ---------- */
        #controls {
            width: 100%;
            max-width: 520px;
            padding: 0 16px 18px;
            display: flex;
            gap: 10px;
        }
        #manualInput {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #2c3340;
            background: #171b22;
            color: #fff;
            font-size: 1rem;
            text-transform: uppercase;
        }
        #manualInput:focus { outline: none; border-color: var(--ok); }
        button.primary {
            padding: 14px 22px;
            border: none;
            border-radius: 12px;
            background: var(--ok);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        button.danger {
            padding: 14px 22px;
            border: none;
            border-radius: 12px;
            background: var(--ko);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: .5; cursor: not-allowed; }

        /* ---------- Historique ---------- */
        #historyWrap { width:100%; max-width:520px; padding:0 16px 40px; }
        #historyWrap h2 { font-size:.95rem; color:#8b93a1; margin-bottom:8px; font-weight:600; }
        #historyList { width:100%; border-collapse:collapse; font-size:.85rem; }
        #historyList td { padding:7px 6px; border-bottom:1px solid #20262f; color:#cfd6e4; }
        #historyList td.s-ok { color:#6fdc8c; font-weight:700; }
        #historyList td.s-ko { color:#ff8080; font-weight:700; }
        #historyList td.s-un { color:var(--warn); font-weight:700; }
    </style>
</head>
<body class="state-waiting">

<header>
    <div class="brand">
        <img src="logo_site.png" alt="">
        <span>التحقق من الحضور</span>
    </div>
    <span id="sessionBanner"></span>
</header>

<div id="stage">
    <div id="icon">🟢</div>
    <div id="bigTitle">قارئ NFC</div>
    <div id="subText">جاهز للمسح — قدّم البطاقة</div>
</div>

<div id="controls">
    <div style="width:100%;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;">
        <button class="primary" id="testBtn">🧪 Tester le lecteur</button>
        <button class="primary" id="startBtn" disabled style="display:none;">▶️ Démarrer la validation</button>
        <button class="danger" id="stopBtn" style="display:none;">⏹ Arrêter la validation</button>
    </div>
    <details style="width:100%;font-size:.85rem;opacity:.85;">
        <summary style="cursor:pointer;color:#8b93a1;">⌨️ إدخال يدوي (للمسؤول فقط — حالات استثنائية)</summary>
        <div style="display:flex;gap:10px;margin-top:8px;direction:rtl;">
            <input type="text" id="manualInput" placeholder="معرّف البطاقة (UID)" autocomplete="off" style="flex:1;padding:12px;border-radius:12px;border:2px solid #2c3340;background:#171b22;color:#fff;font-size:1rem;text-transform:uppercase;direction:ltr;text-align:left;">
            <button class="primary" id="manualBtn">تأكيد</button>
        </div>
    </details>
</div>

<div id="historyWrap">
    <h2>سجل آخر 50 عملية مسح</h2>
    <table id="historyList"><tbody></tbody></table>
</div>
<div id="diag" style="width:100%;max-width:520px;padding:0 16px 30px;font-size:.72rem;color:#6b7380;font-family:Consolas,Menlo,monospace;line-height:1.5;text-align:left;"></div>

<script>
const SUPABASE_URL = 'https://gmoyoflorwaltuanfswn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtb3lvZmxvcndhbHR1YW5mc3duIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxNTc0OTIsImV4cCI6MjA3NzczMzQ5Mn0.Yr0SFLvcPNbvRqNSjzwFdTZkrIz3Z6WZxcIyx8gwjZA';
const db = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

const params = new URLSearchParams(location.search);
const CLUB_ID = params.get('club');

let currentSession = null;
let busy = false;
let busySince = 0;
let validationActive = false;
let pollingStarted = false;
let testing = false;
let sessionTimer = null;

/* ---------------- Sons ---------------- */
let audioCtx = null;
function beep(freq, durationSec) {
    try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.value = 0.25;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durationSec);
    } catch (e) {}
}

/* ---------------- États visuels ---------------- */
function setState(state, title, sub) {
    document.body.className = 'state-' + state;
    const icons = { waiting:'🟢', reading:'◉', success:'✓', expired:'⛔', invalid:'⚠️' };
    document.getElementById('icon').textContent = icons[state] || '○';
    document.getElementById('bigTitle').textContent = title;
    document.getElementById('subText').textContent = sub || '';
}

function panelIdle() {
    setState('waiting', 'قارئ NFC', '🟢 Lecteur connecté\n⏸ Validation inactive');
    document.getElementById('icon').textContent = '📡';
    diag();
}

function panelReady() {
    setState('waiting', '🟢 VALIDATION ACTIVE', 'جاهز للمسح\nقدّم البطاقة');
    diag();
}

function readyToScan() {
    if (validationActive) {
        panelReady();
    } else {
        panelIdle();
    }
    busy = false;
}

let autoResetTimer = null;
function scheduleReady(delayMs) {
    clearTimeout(autoResetTimer);
    autoResetTimer = setTimeout(() => {
        autoResetTimer = null;
        readyToScan();
    }, delayMs);
}

/* ---------------- Séance en cours ---------------- */
async function loadCurrentSession() {
    if (!db) return;
    const banner = document.getElementById('sessionBanner');
    if (!CLUB_ID) {
        if (banner) banner.textContent = '';
        return;
    }
    const today = new Date().toISOString().slice(0, 10);
    const { data } = await db
        .from('sessions')
        .select('id, status, group_type, start_time')
        .eq('club_id', CLUB_ID)
        .eq('session_date', today)
        .in('status', ['live','paused'])
        .order('start_time');

    if (data && data.length) {
        currentSession = data[0];
        if (banner) {
            banner.textContent = `● حصة ${currentSession.group_type || ''} — ${currentSession.status === 'paused' ? 'متوقفة مؤقتاً' : 'جارية'}`;
            banner.classList.add('ok');
        }
    } else {
        currentSession = null;
        if (banner) { banner.textContent = ''; banner.classList.remove('ok'); }
    }
}

function startSessionRefresh() {
    if (sessionTimer) return;
    loadCurrentSession();
    sessionTimer = setInterval(loadCurrentSession, 15000);
}

function stopSessionRefresh() {
    if (sessionTimer) { clearInterval(sessionTimer); sessionTimer = null; }
}

/* ---------------- Traitement d'un scan R30 ----------------
   La valeur reçue est l'UID de la CARTE (ex. 4292384500), PAS un ID
   adhérent. Résolution : nfc_cards.uid -> member_id -> members ->
   abonnement -> présence. Même mécanisme de lecture que « Nouvelle
   carte NFC » (NFCReaderService / adapter HID Keyboard). */
async function handleScan(rawId, method) {
    if (busy) return;
    if (!db) {
        readyToScan();
        return;
    }
    busy = true;
    busySince = Date.now();

    const normalizedUid = (window.NFCReaderService && NFCReaderService.normalizeUid(rawId));
    console.log('[NFC Validator] Scan reçu :', rawId);
    console.log('[NFC Validator] UID normalisé :', normalizedUid);
    if (normalizedUid) { lastUidLog = normalizedUid; diag(); }

    if (!normalizedUid) { readyToScan(); return; }

    setState('reading', 'جاري القراءة…', '');
    await new Promise(r => setTimeout(r, 120));

    try {
        // 1) Carte connue ? (nfc_cards.uid)
        const { data: card, error: cardErr } = await db
            .from('nfc_cards')
            .select('uid, member_id, status')
            .eq('uid', normalizedUid)
            .maybeSingle();
        if (cardErr) throw cardErr;
        console.log('[NFC Validator] Recherche carte :', normalizedUid, '=>', card);

        // 2) Carte non attribuée / libre
        if (!card) {
            addHistory(normalizedUid, null, 'UNASSIGNED', method);
            setState('invalid', '⚠️ بطاقة غير معرّفة', `UID : ${normalizedUid}\nهذه البطاقة غير مرتبطة بأي عضو.`);
            beep(600, 0.4);
            scheduleReady( 2500);
            return;
        }
        if (card.status !== 'assigned' || !card.member_id) {
            addHistory(normalizedUid, null, 'UNASSIGNED', method);
            setState('invalid', '⚠️ بطاقة حرة', `UID : ${normalizedUid}\nهذه البطاقة غير مرتبطة بأي عضو.`);
            beep(600, 0.4);
            scheduleReady( 2500);
            return;
        }

        // 3) Adhérent associé
        const { data: member } = await db
            .from('members')
            .select('id, first_name, last_name, photo_url')
            .eq('id', card.member_id)
            .maybeSingle();
        if (!member) {
            addHistory(normalizedUid, null, 'ERROR', method);
            setState('invalid', 'العضو غير موجود', '');
            beep(600, 0.4);
            scheduleReady( 2000);
            return;
        }
        console.log('[NFC Validator] Adhérent :', member.last_name, member.first_name);

        const fullName = `${member.last_name} ${member.first_name}`;

        // 4) Abonnement + présence du jour en PARALLÈLE (plus rapide)
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10);
        const [stRes, dupRes] = await Promise.all([
            db
                .from('member_subscription_status')
                .select('is_active, end_effective')
                .eq('member_id', card.member_id)
                .maybeSingle(),
            db
                .from('attendance')
                .select('id, attendance_time')
                .eq('member_id', card.member_id)
                .eq('attendance_date', dateStr)
                .limit(1)
        ]);
        const st = stRes.data;
        const existing = dupRes.data;
        const expired = !st || !st.is_active;
        const timeStr = now.toTimeString().slice(0, 8);
        if (existing && existing.length) {
            addHistory(normalizedUid, fullName, 'SUCCESS', method);
            setState('ok', 'مسجّل مسبقاً', `${fullName}\nتم تسجيل الحضور الساعة ${existing[0].attendance_time}`);
            beep(880, 0.2);
            scheduleReady( 1500);
            return;
        }

        // 5) Enregistrement de la présence (miroir table attendance)
        await db.from('attendance').insert({
            member_id: card.member_id,
            club_id: CLUB_ID,
            attendance_date: dateStr,
            attendance_time: timeStr,
            month: now.toISOString().slice(0, 7)
        });

        // 6) Séance : enregistrer la présence en session (si disponible)
        let sessionOk = false;
        if (currentSession) {
            const { error } = await db.from('session_attendances').insert({
                session_id: currentSession.id,
                member_id: card.member_id,
                club_id: CLUB_ID,
                check_in_time: timeStr,
                status: 'PRESENT',
                scan_method: method,
                subscription_status: expired ? 'EXPIRED' : 'ACTIVE'
            });
            if (error) {
                if (error.code === '23505') {
                    // Déjà pointé sur cette séance — doublon malgré l'anti-
                    // doublon global (collision séance présentée en parallèle) :
                    // on considère le doublon comme succès car la présence
                    // existe déjà globalement dans attendance.
                    addHistory(normalizedUid, fullName, 'SUCCESS', method);
                    setState('ok', 'مسجّل مسبقاً', fullName + '\nتم تسجيل الحضور مسبقاً');
                    beep(880, 0.2);
                    scheduleReady( 1500);
                    return;
                }
                throw error;
            }
            sessionOk = true;
        }

        // 7) Affichage du résultat (même si abonnement expiré : présence marquée)
        if (expired) {
            addHistory(normalizedUid, fullName, 'EXPIRED', method);
            setState('expired', '⚠️ تم تسجيل الحضور',
                `${fullName}\n${timeStr}\nالاشتراك منتهٍ — لكن تم تسجيل الحضور بنجاح.${sessionOk ? '' : '\n(لا توجد حصة جارية — سُجّل خارج الحصة)'}`);
        } else {
            addHistory(normalizedUid, fullName, 'SUCCESS', method);
            setState('success', '✓ تم تسجيل الحضور',
                `${fullName}\n${timeStr}${sessionOk ? '' : '\n(لا توجد حصة جارية — سُجّل خارج الحصة)'}`);
        }
        beep(880, 0.2);
        scheduleReady( 1500);
    } catch (err) {
        console.error(err);
        addHistory(normalizedUid || '???', null, 'ERROR', method);
        setState('invalid', 'خطأ', err.message);
        beep(600, 0.4);
        scheduleReady( 2500);
    }
}

/* ---------------- Lecteur : connexion, test, validation ---------------- */
async function bootReader() {
    if (!window.NFCReaderService) { setState('invalid', 'القارئ غير متصل', 'Service NFC introuvable.'); return; }
    try {
        if (!NFCReaderService.isConnected()) {
            await NFCReaderService.connect();
        }
        console.log('[NFC Validator] Lecteur connecté.');
        panelIdle();
    } catch (err) {
        console.error('[NFC Validator] Connexion lecteur :', err);
        setState('invalid', 'القارئ غير متصل', (err && err.message) || 'Connectez le lecteur puis testez-le.');
    }
}

async function testReader() {
    if (testing) return;
    testing = true;
    const testBtn = document.getElementById('testBtn');
    if (testBtn) testBtn.disabled = true;
    setState('reading', '🧪 Test du lecteur', '📡 قدّم بطاقة على القارئ…');
    document.getElementById('icon').textContent = '🧪';
    try {
        if (!NFCReaderService.isConnected()) {
            await NFCReaderService.connect();
        }
        const res = await NFCReaderService.testScan(15000);
        if (res && res.ok && res.value) {
            const uid = NFCReaderService.normalizeUid(res.value);
            setState('success', '✅ Lecteur fonctionnel', 'UID : ' + uid);
            beep(880, 0.25);
            const startBtn = document.getElementById('startBtn');
            if (startBtn) { startBtn.style.display = ''; startBtn.disabled = false; }
        } else {
            setState('invalid', '🔴 Lecteur injoignable', (res && res.message) || 'Aucune carte détectée.');
            beep(400, 0.4);
        }
    } catch (err) {
        console.error('[NFC Validator] Test lecteur :', err);
        setState('invalid', '🔴 Erreur de test', (err && err.message) || 'Test impossible.');
        beep(400, 0.4);
    } finally {
        testing = false;
        if (testBtn) testBtn.disabled = false;
    }
}

function startValidation() {
    if (validationActive) return;
    if (!db) {
        setState('invalid', 'Erreur', 'Supabase indisponible — rechargez la page.');
        return;
    }
    try {
        if (!NFCReaderService.isConnected()) {
            setState('invalid', 'القارئ غير متصل', 'Testez le lecteur avant de démarrer la validation.');
            return;
        }
        if (!pollingStarted) {
            NFCReaderService.startPolling(uid => {
                if (validationActive && typeof uid === 'string' && uid) handleScan(uid, 'NFC');
            });
            pollingStarted = true;
        }
        validationActive = true;
        startSessionRefresh();
        const testBtn = document.getElementById('testBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        if (testBtn) testBtn.style.display = 'none';
        if (startBtn) startBtn.style.display = 'none';
        if (stopBtn) stopBtn.style.display = '';
        console.log('[NFC Validator] Validation démarrée.');
        panelReady();
    } catch (err) {
        console.error('[NFC Validator] Démarrage validation :', err);
        setState('invalid', 'Erreur', (err && err.message) || 'Impossible de démarrer la validation.');
    }
}

function stopValidation() {
    if (!validationActive) return;
    validationActive = false;
    stopSessionRefresh();
    const testBtn = document.getElementById('testBtn');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    if (testBtn) testBtn.style.display = '';
    if (startBtn) startBtn.style.display = '';
    if (stopBtn) stopBtn.style.display = 'none';
    console.log('[NFC Validator] Validation arrêtée.');
    panelIdle();
}

const busyWatchdog = setInterval(() => {
    if (busy && busySince && Date.now() - busySince > 10000) {
        console.warn('[NFC Validator] busy réinitialisé par watchdog.');
        readyToScan();
    }
}, 2000);

/* ---------------- Historique local ---------------- */
const history = [];
function addHistory(id, name, status, method) {
    history.unshift({
        id,
        label: name || id,
        time: new Date().toTimeString().slice(0, 5),
        status,
        method
    });
    if (history.length > 50) history.pop();
    renderHistory();
}

function renderHistory() {
    const cls = { SUCCESS: 's-ok', EXPIRED: 's-ko', UNASSIGNED: 's-un', ERROR: 's-un' };
    document.querySelector('#historyList tbody').innerHTML = history.map(h => `
        <tr>
            <td>${h.time}</td>
            <td>${escapeHtml(h.label)}</td>
            <td>${escapeHtml(h.id)}</td>
            <td class="${cls[h.status] || ''}">${h.status}</td>
            <td>${escapeHtml(h.method)}</td>
        </tr>`).join('');
}

function escapeHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------------- Diagnostic (aide au dépannage) ---------------- */
let lastKeys = [];
let lastUidLog = '-';
function diag() {
    const el = document.getElementById('diag');
    if (!el) return;
    el.innerHTML =
        'Service NFC : ' + (window.NFCReaderService ? 'OK' : 'ABSENT') +
        ' · Lecteur : ' + (window.NFCReaderService && NFCReaderService.isConnected() ? 'connecté' : 'non connecté') +
        ' · Validation : ' + (validationActive ? 'active' : 'inactive') +
        '<br>Touches reçues : ' + (lastKeys.length ? lastKeys.join(' ') : '—') +
        ' · Dernier UID : ' + lastUidLog;
}
window.addEventListener('keydown', e => {
    lastKeys.push(e.key || '[' + e.keyCode + ']');
    if (lastKeys.length > 6) lastKeys.shift();
    diag();
}, true);

/* ---------------- Saisie manuelle (admin, secours) ---- */
document.getElementById('manualBtn').addEventListener('click', () => {
    const val = document.getElementById('manualInput').value;
    if (val.trim()) {
        handleScan(val.trim(), 'MANUAL');
        document.getElementById('manualInput').value = '';
    }
});
document.getElementById('manualInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('manualBtn').click();
});

document.getElementById('testBtn').addEventListener('click', testReader);
document.getElementById('startBtn').addEventListener('click', startValidation);
document.getElementById('stopBtn').addEventListener('click', stopValidation);

bootReader();
</script>
</body>
</html>
