<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC Validator — Kyokushin Manager Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/nfc-reader-service.js?v=20260830"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --ok: #28a745;
            --ko: #dc3545;
            --warn: #ffc107;
            --bg: #101318;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background .25s ease;
        }

        header {
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,.04);
        }
        header .brand { display:flex; align-items:center; gap:10px; font-weight:700; }
        header img { height: 34px; border-radius: 50%; }
        #sessionBanner {
            font-size: .85rem;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255,193,7,.15);
            color: var(--warn);
        }
        #sessionBanner.ok { background: rgba(40,167,69,.18); color: #6fdc8c; }

        /* ---------- Zone d'état ---------- */
        #stage {
            flex: 1;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 30px 16px;
            text-align: center;
        }
        #icon {
            font-size: clamp(64px, 22vw, 120px);
            line-height: 1;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%,100% { opacity: .85; transform: scale(1); }
            50%     { opacity: 1;   transform: scale(1.06); }
        }
        #bigTitle { font-size: clamp(20px, 6vw, 30px); font-weight: 800; letter-spacing: 1px; }
        #subText  { font-size: clamp(14px, 4vw, 18px); color: #aab2bd; white-space: pre-line; }

        body.state-ok, body.state-success { background: #0d2b17; }
        body.state-ok #icon, body.state-success #icon { color: var(--ok); animation: none; }
        body.state-expired { background: #38100f; animation: shakeBg .5s; }
        body.state-expired #icon { color: var(--ko); animation: none; }
        body.state-invalid { background: #2a2113; }
        body.state-invalid #icon { color: var(--warn); animation: none; }
        body.state-reading #icon { animation: spinPulse .9s infinite; }

        @keyframes spinPulse { 50% { transform: scale(.92); opacity:.7 } }
        @keyframes shakeBg { 0%,100%{transform:none} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

        /* ---------- Contrôles ---------- */
        #controls {
            width: 100%;
            max-width: 520px;
            padding: 0 16px 18px;
            display: flex;
            gap: 10px;
        }
        #manualInput {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #2c3340;
            background: #171b22;
            color: #fff;
            font-size: 1rem;
            text-transform: uppercase;
        }
        #manualInput:focus { outline: none; border-color: var(--ok); }
        button.primary {
            padding: 14px 22px;
            border: none;
            border-radius: 12px;
            background: var(--ok);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        /* ---------- Historique ---------- */
        #historyWrap { width:100%; max-width:520px; padding:0 16px 40px; }
        #historyWrap h2 { font-size:.95rem; color:#8b93a1; margin-bottom:8px; font-weight:600; }
        #historyList { width:100%; border-collapse:collapse; font-size:.85rem; }
        #historyList td { padding:7px 6px; border-bottom:1px solid #20262f; color:#cfd6e4; }
        #historyList td.s-ok { color:#6fdc8c; font-weight:700; }
        #historyList td.s-ko { color:#ff8080; font-weight:700; }
        #historyList td.s-un { color:var(--warn); font-weight:700; }
    </style>
</head>
<body class="state-waiting">

<header>
    <div class="brand">
        <img src="logo_site.png" alt="">
        <span>NFC Validator</span>
    </div>
    <span id="sessionBanner">Recherche séance…</span>
</header>

<div id="stage">
    <div id="icon">○</div>
    <div id="bigTitle">LECTEUR NFC</div>
    <div id="subText">Prêt à scanner</div>
</div>

<div id="controls">
    <details style="width:100%;font-size:.85rem;opacity:.85;">
        <summary style="cursor:pointer;color:#8b93a1;">⌨️ Saisie manuelle (administrateur — cas exceptionnel)</summary>
        <div style="display:flex;gap:10px;margin-top:8px;">
            <input type="text" id="manualInput" placeholder="UID de carte" autocomplete="off" style="flex:1;padding:12px;border-radius:12px;border:2px solid #2c3340;background:#171b22;color:#fff;font-size:1rem;text-transform:uppercase;">
            <button class="primary" id="manualBtn">Valider</button>
        </div>
    </details>
</div>

<div id="historyWrap">
    <h2>Historique — 50 derniers scans</h2>
    <table id="historyList"><tbody></tbody></table>
</div>

<script>
const SUPABASE_URL = 'https://gmoyoflorwaltuanfswn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtb3lvZmxvcndhbHR1YW5mc3duIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxNTc0OTIsImV4cCI6MjA3NzczMzQ5Mn0.Yr0SFLvcPNbvRqNSjzwFdTZkrIz3Z6WZxcIyx8gwjZA';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(location.search);
const CLUB_ID = params.get('club');

let currentSession = null;
let busy = false;

/* ---------------- Sons ---------------- */
let audioCtx = null;
function beep(freq, durationSec) {
    try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.value = 0.25;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durationSec);
    } catch (e) {}
}

/* ---------------- États visuels ---------------- */
function setState(state, title, sub) {
    document.body.className = 'state-' + state;
    const icons = { waiting:'🟢', reading:'◉', success:'✓', expired:'⛔', invalid:'⚠️' };
    document.getElementById('icon').textContent = icons[state] || '○';
    document.getElementById('bigTitle').textContent = title;
    document.getElementById('subText').textContent = sub || '';
}

function readyToScan() {
    setState('waiting', '🟢 PRÊT À SCANNER', 'Présentez une carte au lecteur R30');
    busy = false;
}

/* ---------------- Séance en cours ---------------- */
async function loadCurrentSession() {
    const banner = document.getElementById('sessionBanner');
    if (!CLUB_ID) {
        banner.textContent = 'Paramètre club manquant (?club=...)';
        return;
    }
    const today = new Date().toISOString().slice(0, 10);
    const { data } = await supabase
        .from('sessions')
        .select('id, status, group_type, start_time')
        .eq('club_id', CLUB_ID)
        .eq('session_date', today)
        .in('status', ['live','paused'])
        .order('start_time');

    if (data && data.length) {
        currentSession = data[0];
        banner.textContent = `● Séance ${currentSession.group_type || ''} — ${currentSession.status === 'paused' ? 'EN PAUSE' : 'EN COURS'}`;
        banner.classList.add('ok');
    } else {
        currentSession = null;
        banner.textContent = '⛔ Aucune séance en cours';
        banner.classList.remove('ok');
    }
}
setInterval(loadCurrentSession, 15000);

/* ---------------- Traitement d'un scan R30 ----------------
   La valeur reçue est l'UID de la CARTE (ex. 4292384500), PAS un ID
   adhérent. Résolution : nfc_cards.uid -> member_id -> members ->
   abonnement -> présence. Même mécanisme de lecture que « Nouvelle
   carte NFC » (NFCReaderService / adapter HID Keyboard). */
async function handleScan(rawId, method) {
    if (busy) return;
    busy = true;

    const normalizedUid = (window.NFCReaderService && NFCReaderService.normalizeUid(rawId));
    console.log('[NFC Validator] Scan reçu :', rawId);
    console.log('[NFC Validator] UID normalisé :', normalizedUid);

    if (!normalizedUid) { readyToScan(); return; }

    setState('reading', 'LECTURE...', '');
    await new Promise(r => setTimeout(r, 200));

    try {
        // 1) Carte connue ? (nfc_cards.uid)
        const { data: card, error: cardErr } = await supabase
            .from('nfc_cards')
            .select('uid, member_id, status')
            .eq('uid', normalizedUid)
            .maybeSingle();
        if (cardErr) throw cardErr;
        console.log('[NFC Validator] Recherche carte :', normalizedUid, '=>', card);

        // 2) Carte non attribuée / libre
        if (!card) {
            addHistory(normalizedUid, null, 'UNASSIGNED', method);
            setState('invalid', '⚠ CARTE NON ATTRIBUÉE', `UID : ${normalizedUid}\nCette carte n'est associée à aucun adhérent.`);
            beep(600, 0.4);
            setTimeout(readyToScan, 3000);
            return;
        }
        if (card.status !== 'assigned' || !card.member_id) {
            addHistory(normalizedUid, null, 'UNASSIGNED', method);
            setState('invalid', '⚠ CARTE LIBRE', `UID : ${normalizedUid}\nCette carte n'est attribuée à aucun adhérent.`);
            beep(600, 0.4);
            setTimeout(readyToScan, 3000);
            return;
        }

        // 3) Adhérent associé
        const { data: member } = await supabase
            .from('members')
            .select('id, first_name, last_name, photo_url')
            .eq('id', card.member_id)
            .maybeSingle();
        if (!member) {
            addHistory(normalizedUid, null, 'ERROR', method);
            setState('invalid', 'ADHÉRENT INTROUVABLE', '');
            beep(600, 0.4);
            setTimeout(readyToScan, 2500);
            return;
        }
        console.log('[NFC Validator] Adhérent :', member.last_name, member.first_name);

        const fullName = `${member.last_name} ${member.first_name}`;

        // 4) Statut abonnement (règle de continuité centralisée DB).
        //    LA PRÉSENCE EST ENREGISTRÉE MÊME SI ABONNEMENT EXPIRÉ :
        //    seule la présentation visuelle change (voir plus bas).
        const { data: st } = await supabase
            .from('member_subscription_status')
            .select('is_active, end_effective')
            .eq('member_id', card.member_id)
            .maybeSingle();
        const expired = !st || !st.is_active;
        const subDays = st?.end_effective
            ? Math.floor((Date.now() - new Date(st.end_effective + 'T00:00:00')) / 86400000)
            : null;
        const now = new Date();
        const timeStr = now.toTimeString().slice(0, 8);
        const dateStr = now.toISOString().slice(0, 10);
        // Vérif anti-doublon sur la journée (global — valable séance ou hors séance)
        const { data: existing } = await supabase
            .from('attendance')
            .select('id, attendance_time')
            .eq('member_id', card.member_id)
            .eq('attendance_date', dateStr)
            .limit(1);
        if (existing && existing.length) {
            addHistory(normalizedUid, fullName, 'SUCCESS', method);
            setState('ok', 'ℹ DÉJÀ VALIDÉ',
                `${fullName}\nPrésence déjà enregistrée à ${existing[0].attendance_time}`);
            beep(880, 0.2);
            setTimeout(readyToScan, 2000);
            return;
        }

        // 5) Enregistrement de la présence (miroir table attendance)
        await supabase.from('attendance').insert({
            member_id: card.member_id,
            club_id: CLUB_ID,
            attendance_date: dateStr,
            attendance_time: timeStr,
            month: now.toISOString().slice(0, 7)
        });

        // 6) Séance : enregistrer la présence en session (si disponible)
        let sessionOk = false;
        if (currentSession) {
            const { error } = await supabase.from('session_attendances').insert({
                session_id: currentSession.id,
                member_id: card.member_id,
                club_id: CLUB_ID,
                check_in_time: timeStr,
                status: 'PRESENT',
                scan_method: method,
                subscription_status: expired ? 'EXPIRED' : 'ACTIVE'
            });
            if (error) {
                if (error.code === '23505') {
                    // Déjà pointé sur cette séance — doublon malgré l'anti-
                    // doublon global (collision séance présentée en parallèle) :
                    // on considère le doublon comme succès car la présence
                    // existe déjà globalement dans attendance.
                    addHistory(normalizedUid, fullName, 'SUCCESS', method);
                    setState('ok', 'ℹ DÉJÀ VALIDÉ', fullName + '\nPrésence déjà enregistrée');
                    beep(880, 0.2);
                    setTimeout(readyToScan, 2000);
                    return;
                }
                throw error;
            }
            sessionOk = true;
        }

        // 7) Affichage du résultat (même si abonnement expiré : présence marquée)
        if (expired) {
            addHistory(normalizedUid, fullName, 'EXPIRED', method);
            setState('expired', '⚠ PRÉSENCE ENREGISTRÉE',
                `${fullName}\n${timeStr}\nAbonnement expiré — mais la présence a bien été enregistrée.${sessionOk ? '' : '\n(Aucune séance en cours — validée hors séance)'}`);
        } else {
            addHistory(normalizedUid, fullName, 'SUCCESS', method);
            setState('success', '✓ PRÉSENCE VALIDÉE',
                `${fullName}\n${timeStr}${sessionOk ? '' : '\n(Aucune séance en cours — validée hors séance)'}`);
        }
        beep(880, 0.2);
        setTimeout(readyToScan, 2500);
    } catch (err) {
        console.error(err);
        addHistory(normalizedUid || '???', null, 'ERROR', method);
        setState('invalid', 'ERREUR', err.message);
        beep(600, 0.4);
        setTimeout(readyToScan, 3000);
    }
}

/* ---------------- Écoute automatique du lecteur R30 ----------------
   Le R30 est un clavier HID : NFCReaderService arme l'écoute dès la
   page ouverte (aucun bouton « Activer », aucune connexion à faire).
   Chaque présentation d'une carte est traitée automatiquement. */
let nfcPollingStarted = false;
function armReader() {
    if (nfcPollingStarted) return;
    try {
        NFCReaderService.connect()
            .then(() => {
                NFCReaderService.startPolling(uid => {
                    if (typeof uid === 'string' && uid) handleScan(uid, 'NFC');
                });
                nfcPollingStarted = true;
                console.log('[NFC Validator] Lecteur R30 (HID Keyboard) armé — écoute active.');
            })
            .catch(err => {
                console.error('[NFC Validator] Armement lecteur :', err);
                setState('invalid', 'LECTEUR INACTIF', err.message);
            });
    } catch (e) {
        console.error('[NFC Validator] Armement lecteur (sync) :', e);
    }
}

/* ---------------- Historique local ---------------- */
const history = [];
function addHistory(id, name, status, method) {
    history.unshift({
        id,
        label: name || id,
        time: new Date().toTimeString().slice(0, 5),
        status,
        method
    });
    if (history.length > 50) history.pop();
    renderHistory();
}

function renderHistory() {
    const cls = { SUCCESS: 's-ok', EXPIRED: 's-ko', UNASSIGNED: 's-un', ERROR: 's-un' };
    document.querySelector('#historyList tbody').innerHTML = history.map(h => `
        <tr>
            <td>${h.time}</td>
            <td>${escapeHtml(h.label)}</td>
            <td>${escapeHtml(h.id)}</td>
            <td class="${cls[h.status] || ''}">${h.status}</td>
            <td>${escapeHtml(h.method)}</td>
        </tr>`).join('');
}

function escapeHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------------- Saisie manuelle (admin, secours) ---- */
document.getElementById('manualBtn').addEventListener('click', () => {
    const val = document.getElementById('manualInput').value;
    if (val.trim()) {
        handleScan(val.trim(), 'MANUAL');
        document.getElementById('manualInput').value = '';
    }
});
document.getElementById('manualInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('manualBtn').click();
});

loadCurrentSession();
armReader();
readyToScan();
</script>
</body>
</html>
